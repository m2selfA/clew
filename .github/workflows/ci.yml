name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-test-and-package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build deterministic unsigned package
        run: cargo xtask package --out-dir dist

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: clew-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.release.json
            dist/SHA256SUMS
          if-no-files-found: error

  linux-glibc217:
    name: Linux x86_64 / glibc 2.17
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test, package, and verify inside manylinux2014
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e CARGO_TERM_COLOR=always \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash .github/scripts/linux-glibc217.sh full

      - name: Upload glibc 2.17 unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: clew-Linux-X64-glibc217
          path: |
            dist/*.zip
            dist/*.release.json
            dist/SHA256SUMS
          if-no-files-found: error
