[workspace]
members = ["crates/clew-core", "crates/clew-proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
uuid = { version = "1.26.0", features = ["v4"] }

[package]
name = "clew"
version.workspace = true
edition.workspace = true

[dependencies]
