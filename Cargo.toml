[workspace]
members = ["crates/clew-core", "crates/clew-proto", "crates/clew-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[package]
name = "clew"
version.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
clew-runtime = { path = "crates/clew-runtime" }
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.24.2"

[dev-dependencies]
tempfile.workspace = true
