[workspace]
members = ["crates/clew-core", "crates/clew-host", "crates/clew-identity", "crates/clew-proto", "crates/clew-runtime", "crates/clew-transport"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
argon2 = "0.6.0"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
hostname = "0.4.2"
hkdf = "0.13.0"
iroh = "1.1.0"
iroh-mdns-address-lookup = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
prost = "0.14.4"
prost-build = "0.14.4"
resvg = "0.48.1"
protoc-bin-vendored = "3.2.0"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tokio-stream = "0.1.17"
snow = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[package]
name = "clew"
version.workspace = true
edition.workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
clew-core = { path = "crates/clew-core" }
clew-runtime = { path = "crates/clew-runtime" }
clew-host = { path = "crates/clew-host" }
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.24.2"
rfd = "0.17.2"

[dev-dependencies]
clew-identity = { path = "crates/clew-identity" }
tempfile.workspace = true
